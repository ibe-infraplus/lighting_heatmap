server {
    listen 80;
    server_name _;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /lighting_heatmap {
        alias /usr/share/nginx/html/lighting_dashboard.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
    }

    location = /lighting_heatmap/ {
        return 301 /lighting_heatmap;
    }

    location = / {
        return 302 /lighting_heatmap;
    }

    location / {
        return 404;
    }
}
