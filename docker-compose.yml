services:
  lighting-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: lighting-dashboard:latest
    container_name: lighting-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-1112}:8000"
    environment:
      APP_BASE_PATH: /lighting_heatmap
      DB_HOST: "${DB_HOST:-192.168.120.98}"
      DB_PORT: "${DB_PORT:-5433}"
      DB_NAME: "${DB_NAME:-bma_lighting_heatmap}"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:?กำหนด DB_PASSWORD ในไฟล์ .env}"
      DB_SSLMODE: "${DB_SSLMODE:-prefer}"
      SECRET_KEY: "${SECRET_KEY:?กำหนด SECRET_KEY ในไฟล์ .env}"
      APP_ADMIN_USERNAME: "${APP_ADMIN_USERNAME:-admin}"
      APP_ADMIN_PASSWORD: "${APP_ADMIN_PASSWORD:-}"
      APP_ADMIN_DISPLAY_NAME: "${APP_ADMIN_DISPLAY_NAME:-ผู้ดูแลระบบ}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
